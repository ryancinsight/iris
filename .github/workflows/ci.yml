name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Pull requests share one group per ref and cancel superseded runs; default-
  # branch runs get one group per commit, since GitHub supersedes a pending run
  # in a shared group whatever `cancel-in-progress` says.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  adr-index:
    name: ADR index is current
    # atlas owns the one generator (ATLAS-ADR-FORM-NORMALIZATION-2026-09-02); strict: the ADRs carry the canonical heading form and numbering.
    uses: ryancinsight/atlas/.github/workflows/adr-index-guard.yml@63df9d16547db83683980924493e8021db71fffc
    permissions:
      contents: read
    with:
      strict: true

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt
      - uses: taiki-e/install-action@4f74fa8a3d358e568049b7b1a7fbb4fceabda454 # nextest
      # Shared-key rust-cache so the check/clippy/test/doctest/doc build is
      # warm across PRs instead of rebuilding from scratch each time. The
      # entry is written from main only (concurrent branches cannot evict
      # it); invalidation is incremental, so a dependency repin rebuilds only
      # the affected crates. Mirrors CFDrs #375 / ritk #211 / helios #75 /
      # themis #32 under ATLAS-CI-RUNNER-SATURATION.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          shared-key: iris
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo check --all-features
      - run: cargo check --no-default-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo nextest run --all-features
      - run: cargo test --doc --all-features
      - run: cargo doc --no-deps --all-features

  msrv:
    name: Rust 1.95.0 floor check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The install step sets a rustup *default*; the committed rust-toolchain.toml
      # (1.97.0) outranks it. RUSTUP_TOOLCHAIN outranks the file, so this job
      # really compiles at the declared rust-version floor (IRIS-013).
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
      - name: Prove the toolchain under test
        run: rustc --version && cargo --version
      - name: Check the workspace at the floor
        run: cargo check --locked --workspace --all-features --all-targets

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.0
      - uses: taiki-e/install-action@f1d783a3a0ed7012c43e2889fbe3519390e9025b # cargo-deny
      - run: cargo deny check
